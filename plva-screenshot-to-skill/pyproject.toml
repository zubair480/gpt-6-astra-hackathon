[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plva-skill-learning"
version = "0.1.0"
description = "Local evidence-backed skill drafting for PLVA"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "Pillow>=11,<13"]

[project.scripts]
skillforge = "plva_skill_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plva_skill_learning = ["contracts/*.json", "data/*.json", "data/*.html"]
