# PLVA private reasoning: OpenShell sandbox policy (zero egress).
#
# STATUS: TESTED 2026-09-08 with openshell 0.0.116 / openshell-gateway 0.0.116 (Homebrew),
# Docker driver on Colima (Docker 29.x, vz, aarch64), macOS 26.4 Apple Silicon. The schema
# below is what `openshell sandbox get <name> --policy-only` prints for the built-in
# restrictive default, plus the documented `process` and `network_policies` sections; every
# key was accepted by `openshell sandbox create --policy` on that version. Applied by
# sandbox/start.sh --backend openshell; sandbox/deny_check.py then runs inside the resulting
# sandbox and its exit status is the evidence (see docs/SECURITY.md), not this file.
#
# Inference and the cleartext-handling service both run INSIDE this sandbox. The only way in
# is the gateway's explicit loopback port forward created by sandbox/start.sh:
#   openshell forward service plva-pr --target-port 18555 --local 127.0.0.1:18575
# That forward is gateway state, not policy, and it is inbound only.
#
# The model is NOT baked into the image. start.sh bind-mounts models/ read-only at /models via
# the docker driver config ({"docker":{"mounts":[{"type":"bind",...,"read_only":true}]}}).

# Policy schema version. Must be 1.
version: 1

# --- filesystem (static: fixed at sandbox creation) --------------------------------------
filesystem_policy:
  # Do NOT mount the operator's working directory into the sandbox.
  include_workdir: false
  # Readable, never writable. Everything not listed is inaccessible (Landlock).
  read_only:
    - /usr          # Python interpreter, shared libraries (Debian merged-usr: /bin,/lib -> /usr)
    - /lib          # loader symlink
    - /bin          # sh, needed by `openshell sandbox exec ... -- sh -c`
    - /etc          # passwd/ssl certs; read-only so the runtime cannot alter them
    - /proc         # process introspection used by the runtime; read-only
    - /dev/urandom  # entropy for the per-launch bearer credential
    - /app          # the installed plva_private_reasoning package and its venv (in the image)
    - /models       # READ-ONLY bind mount of the host models/ directory (GGUF weights)
  # The only writable locations. Ephemeral: nothing survives `openshell sandbox delete`.
  read_write:
    - /tmp          # runtime dir /tmp/plva-pr: bearer credential (0600) and deny-check evidence
    - /dev/null

# --- landlock (static) --------------------------------------------------------------------
landlock:
  # best_effort: warn and continue if a listed path is missing in the image.
  compatibility: best_effort

# --- process identity (static) ------------------------------------------------------------
process:
  # Never root. The image creates `sandbox` (uid 1000); OpenShell also requires an OCI USER.
  run_as_user: sandbox
  run_as_group: sandbox

# --- network (dynamic: hot-reloadable with `openshell policy set`) --------------------------
# OpenShell's sandbox network runtime (capabilities: policy-dns-transparent-tcp) is
# deny-by-default: a connection is allowed only if it matches a listed endpoint for a listed
# binary. An EMPTY map denies every outbound connection from every binary. Do not add entries:
# weights, packages, and tokenizer files are provisioned into the image / mount beforehand.
network_policies: {}
